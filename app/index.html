<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12324a">
  <title>Mapa de Evacuación</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/estilos.css?v=14">
</head>
<body>
  <div class="aviso-simulacro" id="aviso-simulacro">PROTOTIPO · SIMULACRO · No reemplaza las instrucciones de la autoridad</div>

  <div class="banner-alerta" id="banner-alerta" role="alert" hidden></div>

  <header class="cabecera">
    <div class="titulo">
      <h1>Mapa de Evacuación</h1>
      <div class="selectores">
        <label>Zona <select id="selector-zona"></select></label>
        <label>Amenaza <select id="selector-amenaza"></select></label>
      </div>
    </div>
  </header>

  <main class="contenido">
    <div id="mapa" role="application" aria-label="Mapa de la zona"></div>

    <section class="ficha" id="ficha">
      <div class="diagnostico" id="diagnostico" hidden>
        <div class="modos" role="group" aria-label="Origen de la posición">
          <button type="button" id="btn-simulacion" class="activo">Simular con pin</button>
          <button type="button" id="btn-gps">Usar mi ubicación</button>
        </div>
        <div class="estado" id="estado" aria-live="polite">
          <div class="estado-titulo" id="estado-titulo"></div>
          <div class="estado-texto" id="estado-texto"></div>
          <div class="estado-detalle" id="estado-detalle"></div>
        </div>
        <div class="ruta-info" id="ruta-info" hidden aria-live="polite"></div>
      </div>
      <section class="informacion" id="informacion" aria-label="Información sobre la amenaza"></section>
      <ul class="leyenda" id="leyenda"></ul>
      <p class="fuente" id="fuente"></p>
      <p class="estado-alertas" id="estado-alertas"></p>
    </section>
  </main>

  <div class="mensaje-error" id="mensaje-error" hidden></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/leaflet-rotate.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="vendor/turf.min.js"></script>
  <script type="module" src="js/main.js?v=14"></script>
</body>
</html>
